name: Verify foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reviewed lockfile for dependency remediation
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo LOCKFILE_BASE64_START
          base64 -w0 package-lock.json
          echo
          echo LOCKFILE_BASE64_END
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Profile route regression
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ --output /dev/null; then
              break
            fi
            sleep 1
          done
          node tests/profile-http.mjs http://127.0.0.1:3000
